[package]
name = "syncra-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Оболочка Tauri: окно, IPC и больше ничего. Вся логика — в `syncra-core`,
# здесь только обёртки команд (§8.2).

[lib]
name = "syncra_app_lib"
# staticlib/cdylib нужны для мобильного таргета (MVP 2, iOS); на десктопе
# используется rlib. Оставлено сразу, чтобы не переразбивать крейт потом.
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Без этой фичи `tauri::generate_context!` считает сборку отладочной (в
# `tauri-macros`: `dev = cfg!(not(feature = "custom-protocol"))`), не встраивает
# `frontendDist` в бинарник и открывает окно на `devUrl` — то есть на пустом
# `localhost:5173`, если рядом не крутится Vite. Фичу включает `cargo tauri
# build`; при обычном `cargo build` её нужно передать руками.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
syncra-core = { path = "../syncra-core" }
tauri = { version = "2", features = [] }
# Системное окно выбора файла для импорта и восстановления из бэкапа (F12).
# Зовётся ТОЛЬКО из Rust: у фронта плагина нет и разрешений в capabilities ему
# не выдано — путь к файлу приходит в ядро готовым аргументом, как и путь к БД.
tauri-plugin-dialog = "2"
# Имя хоста для списка устройств (F9). Платформенный факт берёт оболочка
# и передаёт ядру готовой строкой — как и путь к БД (§8.2).
gethostname = "1"
serde.workspace = true
serde_json.workspace = true

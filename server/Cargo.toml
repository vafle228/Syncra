[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
# Подпись и обмен ключами устройства (§8.1, §2.1). Обе пары заводятся сразу, в
# S1: формат запечатанного секрета иначе пришлось бы мигрировать в S3, когда
# ключи уже разъехались по устройствам.
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
# Отпечаток устройства (SAS, §2.2) считается хешем публичных ключей.
sha2 = "0.10"
# QR-код сопряжения кодирует ЯДРО, а не UI (§2.2): в пейлоаде лежит одноразовый
# ключ сеанса, и чем меньше он существует в виде JS-строки, тем лучше.
# `default = [image, svg, pic]` выключен целиком — наружу уходит матрица модулей,
# а не картинка, и транзитивных зависимостей у крейта тогда не остаётся вовсе.
qrcode = { version = "0.14", default-features = false }
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.2"

[profile.release]
# Меньше следов ядра в бинарнике: сообщения об ошибках и так не несут секретов,
# но и путей сборки в нём быть незачем.
strip = true
